services:
  web:
    build: .
    container_name: LP_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit
    container_name: LP_mailpit
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP
  
  sass:
    image: node:22-alpine
    container_name: lp_sass
    working_dir: /app
    volumes:
      - ./src:/app
    command: npx --yes sass --watch --poll --silence-deprecation=import --silence-deprecation=color-functions scss:css
    profiles: ["tools"]